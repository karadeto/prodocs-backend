services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: prodocs
      POSTGRES_PASSWORD: prodocs
      POSTGRES_DB: prodocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodocs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
